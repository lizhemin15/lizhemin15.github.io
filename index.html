        /* Table scroll wrapper for responsive tables */
        .table-scroll-wrapper {
            overflow-x: auto;
            margin: 0 -20px;
            padding: 0 20px;

        .table-scroll-wrapper table {
            min-width: 600px;
            white-space: nowrap;

        .table-scroll-wrapper table th {
            white-space: nowrap;
            min-width: 120px;
        }

        /* Math formulas in tables - allow proper rendering */
        .table-scroll-wrapper .math-container {
            white-space: normal;
        }

        /* Display mode math in tables */
        .table-scroll-wrapper .math-container.katex-display {
            display: inline-block;
            vertical-align: middle;
            white-space: normal;
        }

        /* Allow multiline math formulas to render properly */
        .table-scroll-wrapper .katex-display .katex-html {
            white-space: normal;
            overflow: visible;
        }

        /* Scrollbar styling for table wrapper */
        .table-scroll-wrapper::-webkit-scrollbar {
            height: 8px;
        }

        .table-scroll-wrapper::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;

        /* Math formula styles */

            font-size: 1.1em;

        .katex-display {
            margin: 12px 0;
            text-align: center;
            display: block;
            overflow: hidden;

        /* 确保块级公式容器正确显示 */
        .math-container.katex-display {
            display: block;
            text-align: center;
            margin: 12px 0;
            overflow: hidden;
        }

        /* 确保KaTeX渲染的块级公式正确居中 */
        .katex-display .katex {
            display: inline-block;
            text-align: center;
        }

        /* 防止公式换行 */
        .katex-display .katex-html {
            white-space: nowrap;
            overflow-x: auto;
        }

        /* Selectable math formulas (for copying original text) */
        .math-container {
            position: relative;
            display: inline-block;
        }

        .math-source {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #2d3748;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .math-container:hover .math-source {
            display: block;
        }

        /* Formula tooltip styles */
        .formula-tooltip {
            position: fixed;
            background: rgba(45, 55, 72, 0.95);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10000;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 600px;
            min-width: 200px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .formula-tooltip.show {
            opacity: 1;
            transform: translateY(0);

        .formula-tooltip .katex {
            font-size: 1.2em;
            color: white;

        /* Table of Contents (TOC) Floating Navigation */
        .toc-container {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 200px;
            max-height: 60vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            z-index: 998;
            transform: translateX(calc(100% + 20px));
            transition: all 0.3s ease;
            font-size: 0.8rem;
        }

        .toc-container.show {
            transform: translateX(0) !important;
        }

        .toc-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);

            color: white;
            border-radius: 8px 8px 0 0;
            font-weight: 500;
            font-size: 0.75rem;
        }

        .toc-toggle {
            background: none;
            border: none;
            color: white;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 2px;
            border-radius: 3px;
            transition: all 0.2s ease;
        }

        .toc-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .toc-content {
            max-height: calc(60vh - 32px);
            overflow-y: auto;
            padding: 4px 0;
        }

            width: 3px;
        }

        .toc-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .toc-content::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 2px;
        }

        .toc-item {
            display: block;
            padding: 3px 10px;
            color: var(--text-color);
            text-decoration: none;
            border-left: 2px solid transparent;
            transition: all 0.15s ease;
            cursor: pointer;
            font-size: 0.75rem;
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toc-item:hover {
            background: rgba(52, 152, 219, 0.08);
            border-left-color: var(--accent-color);
            color: var(--primary-color);
        }

        .toc-item.active {

            border-left-color: var(--accent-color);
            color: var(--accent-color);
            font-weight: 500;
        }

        }

        .toc-item.level-2 {

        }

        .toc-item.level-5,

            padding-left: 46px;

        }

        /* TOC Toggle Button */
        .toc-fab {
            position: fixed;
            bottom: 24px;

            background: var(--accent-color);

        /* Section number styles */
        .section-number {
            color: var(--accent-color);

        .section-number::after {
            content: "";
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-color), transparent);
            border-radius: 1px;
        }

        /* Heading section styles */
        h1[data-section-id] {
            border-bottom: 2px solid var(--accent-color);

        h2[data-section-id] {

            padding-left: 1rem;
            margin-left: -1rem;
        }

        h3[data-section-id] {
            position: relative;
        }

        h3[data-section-id]::before {
            content: "";
            position: absolute;
            left: -0.5rem;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 1.2em;
            background: var(--accent-color);
            border-radius: 2px;

                <i class="fas fa-sun"></i>
            </button>
        </div>
    </main>

    <script>
        // Debug mode - set to true for development logging
        const DEBUG = false;
        const log = DEBUG ? console.log.bind(console) : function(){};
        const warn = DEBUG ? console.warn.bind(console) : function(){};

        // Utility: throttle & debounce
        function throttle(fn, ms) {
            let last = 0;
            return function(...args) {
                const now = Date.now();
                if (now - last >= ms) { last = now; fn.apply(this, args); }
            };
        }
        function debounce(fn, ms) {
            let timer;
            return function(...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), ms);
            };
        }

        // Global configuration object
        let siteConfig = null;
        let currentSection = null;
        let tocVisible = true;
        let activeHeadingId = null;
        
        // URL routing state
        let currentBlogPost = null;
        let isInitialLoad = true;

        // Theme management
        let currentTheme = localStorage.getItem('theme') || 'light';

        // Scroll position management
        let scrollPositionManager = {
            // 保存滚动位置
            saveScrollPosition: function() {
                const mainContent = document.querySelector('.main-content');
                if (!mainContent) return;
                
                const scrollData = {
                    scrollTop: mainContent.scrollTop,
                    scrollLeft: mainContent.scrollLeft,
                    timestamp: Date.now(),
                    section: currentSection,
                    blogPost: currentBlogPost,
                    url: window.location.href
                };
                
                // 保存到 sessionStorage（页面关闭后清除）
                sessionStorage.setItem('scrollPosition', JSON.stringify(scrollData));
                log('📍 Scroll position saved:', {
                    scrollTop: scrollData.scrollTop,
                    section: scrollData.section,
                    blogPost: scrollData.blogPost
                });
            },
            
            // 恢复滚动位置
            restoreScrollPosition: function() {
                try {
                    const savedData = sessionStorage.getItem('scrollPosition');
                    if (!savedData) return false;
                    
                    const scrollData = JSON.parse(savedData);
                    const currentURL = window.location.href;
                    
                    // 检查是否是同一个页面（URL匹配）
                    if (scrollData.url !== currentURL) {
                        log('URL changed, clearing saved scroll position');
                        sessionStorage.removeItem('scrollPosition');
                        return false;
                    }
                    
                    // 检查时间戳（如果超过30分钟，清除保存的位置）
                    const timeDiff = Date.now() - scrollData.timestamp;
                    if (timeDiff > 30 * 60 * 1000) {
                        log('Scroll position too old, clearing');
                        sessionStorage.removeItem('scrollPosition');
                        return false;
                    }
                    
                    const mainContent = document.querySelector('.main-content');
                    if (!mainContent) return false;
                    
                    // 等待内容加载完成后再恢复滚动位置
                    setTimeout(() => {
                        mainContent.scrollTo({
                            top: scrollData.scrollTop,
                            left: scrollData.scrollLeft,
                            behavior: 'instant' // 使用 instant 避免动画
                        });
                        log('📍 Scroll position restored:', {
                            scrollTop: scrollData.scrollTop,
                            section: scrollData.section,
                            blogPost: scrollData.blogPost
                        });
                    }, 100);
                    
                    return true;
                } catch (error) {
                    console.error('Error restoring scroll position:', error);
                    sessionStorage.removeItem('scrollPosition');
                    return false;
                }
            },
            
            // 清除保存的滚动位置
            clearScrollPosition: function() {
                sessionStorage.removeItem('scrollPosition');
                log('🗑️ Scroll position cleared');
            },
            
            // 设置滚动位置保存的防抖
            debounceSave: null,
            
            // 防抖保存滚动位置
            debouncedSave: function() {
                if (this.debounceSave) {
                    clearTimeout(this.debounceSave);
                }
                this.debounceSave = setTimeout(() => {
                    this.saveScrollPosition();
                }, 150); // 150ms 防抖
            },
            
            // 检查是否是页面刷新
            isPageRefresh: function() {
                // 方法1：使用 performance.navigation（已废弃但仍有支持）
                if (window.performance && window.performance.navigation && 
                    window.performance.navigation.type === window.performance.navigation.TYPE_RELOAD) {
                    return true;
                }
                
                // 方法2：使用 performance.getEntriesByType
                if (window.performance && window.performance.getEntriesByType) {
                    const navigationEntries = window.performance.getEntriesByType('navigation');
                    if (navigationEntries.length > 0) {
                        const navigationEntry = navigationEntries[0];
                        return navigationEntry.type === 'reload';
                    }
                }
                
                // 方法3：检查页面加载时间戳
                const loadTime = sessionStorage.getItem('pageLoadTime');
                const currentTime = Date.now();
                sessionStorage.setItem('pageLoadTime', currentTime);
                
                // 如果时间差小于5秒，可能是刷新
                if (loadTime && (currentTime - parseInt(loadTime)) < 5000) {
                    return true;
                }
                
                return false;
            },
            
            // 智能恢复滚动位置（只在页面刷新时恢复）
            smartRestore: function() {
                // 只在页面刷新时恢复滚动位置
                if (this.isPageRefresh()) {
                    log('🔄 Page refresh detected, attempting to restore scroll position');
                    return this.restoreScrollPosition();
                } else {
                    log('➡️ Not a page refresh, skipping scroll position restoration');
                    return false;
                }
            }
        };

        // Initialization after page load
        // Global error boundary - catch null reference errors before they crash the page
        window.addEventListener('error', function(event) {
            if (event.message && event.message.includes('Cannot set properties of null')) {
                warn('Suppressed null reference error:', event.message);
                event.preventDefault();
                return true;
            }
        });

        document.addEventListener('DOMContentLoaded', async function() {
            try {
                log('Starting website initialization...');
                
                // 设置页面加载时间戳
                sessionStorage.setItem('pageLoadTime', Date.now().toString());
                
                // Check if all required dependencies are loaded
                try {
                    checkDependencies();
                } catch (depError) {
                    warn('Some dependencies missing, attempting to load fallbacks...');
                    await loadFallbackLibraries();
                    checkDependencies(); // Check again after loading fallbacks
                }
                
                // Configure marked after dependencies are confirmed loaded
                if (typeof marked !== 'undefined' && typeof hljs !== 'undefined') {
                    marked.setOptions({
                        highlight: function(code, lang) {
                            if (lang && hljs.getLanguage(lang)) {
                                return hljs.highlight(code, { language: lang }).value;
                            }
                            return hljs.highlightAuto(code).value;
                        },
                        breaks: true,
                        gfm: true
                    });
                }
                
                // Initialize theme
                initializeTheme();
                
                // Load configuration file with enhanced error handling
                await loadConfig();
                
                // Apply configuration
                applyConfig();
                
                // Generate navigation menu
                generateNavigation();
                // Initialize hidden diary unlock button
                initDiaryUnlock();

                // Initialize URL routing
                initURLRouting();
                
                // Load content based on current URL
                loadContentFromURL();
                
                log('Website initialization completed successfully');
                
                // 尝试恢复滚动位置
                setTimeout(() => {
                    scrollPositionManager.smartRestore();
                }, 200);
                
                // 显示功能状态
                log('✅ Scroll position management enabled - your reading progress will be saved and restored on page refresh');
                
            } catch (error) {
                console.error('Initialization failed:', error);
                
                // Show more detailed error information
                let errorMessage = 'Unable to load website configuration file';
                let errorDetails = error.message;
                
                if (error.message.includes('Required libraries not loaded')) {
                    errorMessage = 'External libraries failed to load';
                    errorDetails = 'Some required JavaScript libraries could not be loaded. Please check your internet connection and refresh the page.';
                } else if (error.message.includes('Failed to fetch')) {
                    errorMessage = 'Network error: Unable to connect to server';
                    errorDetails = 'Please check your internet connection and try refreshing the page.';
                } else if (error.message.includes('HTTP 404')) {
                    errorMessage = 'Configuration file not found';
                    errorDetails = 'The config.yml file is missing from the server.';
                } else if (error.message.includes('YAML parsing failed')) {
                    errorMessage = 'Configuration file format error';
                    errorDetails = 'The config.yml file contains invalid YAML syntax.';
                } else if (error.message.includes('Empty configuration file')) {
                    errorMessage = 'Configuration file is empty';
                    errorDetails = 'The config.yml file appears to be empty or corrupted.';
                }
                
                showError('Configuration Load Failed', errorMessage, errorDetails);
                
                // Add a manual retry button
                const contentDiv = document.getElementById('content');
                if (contentDiv) {
                    const retryButton = contentDiv.querySelector('.btn-primary');
                    if (retryButton) {
                        retryButton.onclick = async function() {
                            log('Manual retry requested');
                            contentDiv.innerHTML = `
                                <div class="loading">
                                    <i class="fas fa-spinner"></i>
                                    <p>Retrying configuration load...</p>
                                    <div class="loading-progress">
                                        <div class="loading-progress-bar"></div>
                                    </div>
                                </div>
                            `;
                            
                            try {
                                await loadConfig();
                                applyConfig();
                                generateNavigation();
                                initDiaryUnlock();
                                initURLRouting();
                                loadContentFromURL();
                            } catch (retryError) {
                                console.error('Retry failed:', retryError);
                                showError('Configuration Load Failed', errorMessage, errorDetails);
                            }
                        };
                    }
                }
            }

            // Listen for window resize (debounced)
            window.addEventListener('resize', debounce(function() {
                if (window.innerWidth > 768) {
                    const sidebar = document.getElementById('sidebar');
                    if (sidebar) sidebar.classList.remove('active');
                    const overlay = document.querySelector('.overlay');
                    if (overlay) overlay.classList.remove('active');
                }
            }, 200));
            
            // Listen for browser back/forward buttons
            window.addEventListener('popstate', function(event) {
                log('Popstate event:', event.state);
                loadContentFromURL();
            });
            
            // 拦截站内导航链接的点击，使用SPA导航而非整页刷新
            // 处理 <a href="?section=xxx"> 和 <a href="https://lizhemin15.github.io/?section=xxx"> 等链接
            document.addEventListener('click', function(e) {
                const link = e.target.closest('a[href]');
                if (!link) return;
                
                const href = link.getAttribute('href');
                if (!href) return;
                
                // 跳过外部链接、锚点链接、非导航链接
                if (href.startsWith('#') || href.startsWith('javascript:') || 
                    href.startsWith('mailto:') || href.startsWith('tel:') ||
                    link.target === '_blank') return;
                
                // 检查是否是站内导航链接（包含 section 或 blog 参数）
                const hasSectionParam = href.includes('section=') || href.includes('blog=');
                if (!hasSectionParam) return;
                
                // 检查是否是同源链接
                try {
                    const linkUrl = new URL(href, window.location.origin);
                    if (linkUrl.origin !== window.location.origin) return;
                } catch(err) { return; }
                
                // 拦截点击，使用SPA导航
                e.preventDefault();
                const targetUrl = new URL(href, window.location.origin);
                const section = targetUrl.searchParams.get('section');
                const blog = targetUrl.searchParams.get('blog');
                
                scrollPositionManager.clearScrollPosition();
                updateURL({ section: section, blog: blog });
                loadContentFromURL();
            });
            
            // 添加滚动位置保存监听器
            const mainContent = document.querySelector('.main-content');
            if (mainContent) {
                mainContent.addEventListener('scroll', throttle(function() {
                    scrollPositionManager.debouncedSave();
                }, 100));
            }
            
            // 页面卸载前保存滚动位置
            window.addEventListener('beforeunload', function() {
                scrollPositionManager.saveScrollPosition();
            });
            
            // 监听全屏状态变化
            document.addEventListener('fullscreenchange', handleFullscreenChange);
            document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
            document.addEventListener('mozfullscreenchange', handleFullscreenChange);
            document.addEventListener('MSFullscreenChange', handleFullscreenChange);
        });

        // Theme management functions
        function initializeTheme() {
            const themeToggle = document.getElementById('theme-toggle');
            if (!themeToggle) return;
            const icon = themeToggle.querySelector('i');
            if (!icon) return;
            
            // Set initial theme
            document.documentElement.setAttribute('data-theme', currentTheme);
            updateThemeIcon(icon, currentTheme);
            
            // Add click event listener
            themeToggle.addEventListener('click', function() {
                toggleTheme();
            });
        }

        function toggleTheme() {
            const themeToggle = document.getElementById('theme-toggle');
            if (!themeToggle) return;
            const icon = themeToggle.querySelector('i');
            
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            // Update DOM
            document.documentElement.setAttribute('data-theme', currentTheme);
            updateThemeIcon(icon, currentTheme);
            
            // Save to localStorage
            localStorage.setItem('theme', currentTheme);
            
            // Add transition effect
            themeToggle.style.transform = 'scale(1.2) rotate(360deg)';
            setTimeout(() => {
                themeToggle.style.transform = '';
            }, 300);
        }

        function updateThemeIcon(icon, theme) {
            if (theme === 'dark') {
                icon.className = 'fas fa-moon';
                icon.style.color = '#f1c40f';
            } else {
                icon.className = 'fas fa-sun';
                icon.style.color = '#f39c12';
            }
        }

        // Initialize URL routing system
        function initURLRouting() {
            log('Initializing URL routing system');
            // popstate event already handles back/forward navigation
            // No need for setInterval polling
        }

        // Load content based on current URL
        function loadContentFromURL() {
            const url = new URL(window.location.href);
            const section = url.searchParams.get('section');
            const blogPost = url.searchParams.get('blog');
            
            log('Loading content from URL - section:', section, 'blog:', blogPost);
            
            // Update navigation state based on current URL
            updateNavigationState(section, blogPost);
            
            if (blogPost) {
                // Load specific blog post
                loadBlogPostByURL(blogPost);

        // Update URL without triggering page reload
        function updateURL(params, replace = false) {
            const url = new URL(window.location.href);
            
            // Clear existing parameters
            url.searchParams.delete('section');
            url.searchParams.delete('blog');
            
            // Add new parameters
            Object.entries(params).forEach(([key, value]) => {
                if (value) {
                    url.searchParams.set(key, value);
                }
            });
            
            const newURL = url.toString();
            log('Updating URL:', newURL, 'replace:', replace);
            
            // 如果不是替换操作（即页面切换），清除滚动位置
            if (!replace) {
                scrollPositionManager.clearScrollPosition();
            }
            
            if (replace) {
                window.history.replaceState(params, '', newURL);
            } else {
                window.history.pushState(params, '', newURL);
            }
        }

        // Load configuration file
        async function loadConfig() {
            const maxRetries = 3;
            let lastError = null;
            
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    log(`Attempting to load config (attempt ${attempt}/${maxRetries})`);
                    
                    // Add cache-busting parameter to prevent caching issues
                    const timestamp = new Date().getTime();
                    const configUrl = `./config.yml?t=${timestamp}`;
                    
                    const response = await fetch(configUrl, {
                        method: 'GET',
                        headers: {
                            'Cache-Control': 'no-cache, no-store, must-revalidate',
                            'Pragma': 'no-cache',
                            'Expires': '0'
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const yamlText = await response.text();
                    
                    // Validate that we got actual YAML content
                    if (!yamlText || yamlText.trim().length === 0) {
                        throw new Error('Empty configuration file received');
                    }
                    
                    // Try to parse YAML
                    try {
                        siteConfig = jsyaml.load(yamlText);
                    } catch (yamlError) {
                        throw new Error(`YAML parsing failed: ${yamlError.message}`);
                    }
                    
                    // Validate essential configuration
                    if (!siteConfig) {
                        throw new Error('Configuration object is null or undefined');
                    }
                    
                    if (!siteConfig.site || !siteConfig.navigation) {
                        throw new Error('Missing essential configuration sections (site, navigation)');
                    }
                    
                    log('Configuration loaded successfully:', siteConfig);
                    return; // Success, exit the retry loop
                    
                } catch (error) {
                    lastError = error;
                    console.error(`Configuration load attempt ${attempt} failed:`, error);
                    
                    if (attempt < maxRetries) {
                        // Wait before retrying (exponential backoff)
                        const waitTime = Math.pow(2, attempt) * 1000;
                        log(`Waiting ${waitTime}ms before retry...`);
                        await new Promise(resolve => setTimeout(resolve, waitTime));
                    }
                }
            }
            
            // All retries failed
            console.error('All configuration load attempts failed');
            throw new Error(`Configuration load failed after ${maxRetries} attempts. Last error: ${lastError.message}`);
        }

        // Encrypted diary files (not shown in blog list, only accessible via hidden button)
        // Auto-discovered from _decryptedPosts __cipher__ entries + DIARY_FILES fallback
        const DIARY_FILES = ['private-diary-001.md.enc'];

        function getDiaryFiles() {
            // Merge static list with any .enc files pre-cached by loadBlogsContent
            const files = new Set(DIARY_FILES);
            _decryptedPosts.forEach((v, k) => {
                if (k.startsWith('__cipher__')) files.add(k.replace('__cipher__', ''));

        function initDiaryUnlock() {
            const btn = document.getElementById('diary-unlock-btn');
            if (!btn) return;

            // Prevent duplicate listeners — initDiaryUnlock may be called multiple times
            if (btn.dataset.diaryInit === '1') return;
            btn.dataset.diaryInit = '1';

            btn.addEventListener('click', async function() {
                const diaryFiles = getDiaryFiles();
                if (diaryFiles.length === 0) return;

                // If already unlocked, show diary list directly
                const unlockedFiles = diaryFiles.filter(f => _decryptedPosts.has(f) && !_decryptedPosts.get(f).startsWith?.('U2FsdGVk'));
                if (unlockedFiles.length > 0) {
                    showDiaryList(unlockedFiles, diaryFiles);
                    return;
                }

                // Collect ciphertext for all diary files
                try {
                    const cipherMap = new Map();
                    for (const fileName of diaryFiles) {
                        let rawText = _decryptedPosts.get('__cipher__' + fileName);
                        if (!rawText) {
                            const resp = await fetch('./blogs/' + fileName + '?t=' + Date.now());
                            if (resp.ok) rawText = await resp.text();
                        }
                        if (rawText) cipherMap.set(fileName, rawText);
                    }

                    if (cipherMap.size === 0) return;

                    // Single password prompt — try to decrypt all files with same password
                    const firstFile = cipherMap.keys().next().value;
                    const firstCipher = cipherMap.get(firstFile);
                    let savedPwd = '';

                    const decrypted = await showDecryptModal('加密日记', async (pwd) => {
                        savedPwd = pwd; // save for batch decrypt
                        const result = await decryptBlogContent(firstCipher, pwd);
                        if (result === null) return null;
                        return result;
                    });

                    if (decrypted !== null) {
                        // First file decrypted, try the rest with same password
                        _decryptedPosts.set(firstFile, decrypted);
                        for (const [fn, cipher] of cipherMap) {
                            if (fn === firstFile) continue;
                            try {
                                const d = await decryptBlogContent(cipher, savedPwd);
                                if (d !== null) _decryptedPosts.set(fn, d);
                            } catch(e) { /* skip */ }
                        }
                        btn.classList.add('unlocked');
                        const allUnlocked = diaryFiles.filter(f => _decryptedPosts.has(f) && !_decryptedPosts.get(f).startsWith?.('U2FsdGVk'));
                        showDiaryList(allUnlocked, diaryFiles);
                    }
                } catch (e) {
                    console.warn('Diary unlock failed:', e);
                }
            });
        }

        // Markdown configuration - moved to DOMContentLoaded callback to ensure

        // Fixed mathematical formula processing system
        function preprocessMathFormulas(content) {

            // 处理theorem代码块 - 在数学公式处理之前先保存原始内容

                log('处理proposition代码块占位符...');

            // 处理lemma代码块

            // 处理remark代码块
            const remarkBlocks = [];
            
            content = content.replace(/```remark(?:\s+(.*?))?\s*\n([\s\S]*?)\n```/g, function(match, title, remarkContent) {
                log('处理remark代码块占位符...');
                remarkIndex++;
                const remarkId = `rem${remarkIndex}`;

                log(`创建remark占位符: ${remarkId}, 编号=${remarkIndex}, 标题=${remarkTitle}`);
                return placeholder;

            // 首先提取所有表格的原始内容（在处理任何公式之前）
            const originalTableContents = [];
            const tempContent = content.replace(/```table(?:\s+(.*?))?\s*\n([\s\S]*?)\n```/g, function(match, title, tableContent) {

                originalTableContents.push({
                    fullMatch: match,

            // 新增：处理equation代码块，直接替换成HTML div格式
            content = content.replace(/```equation\s*\n([\s\S]*?)\n```/g, function(match, formula) {
                log('找到equation代码块:', formula.substring(0, 50) + '...');
                equationIndex++;
                const equationId = `eq${equationIndex}`;
                // 给公式末尾添加编号（在$$符号内部）
                const numberedFormula = formula.trim().replace(/\$\$([\s\S]*?)\$\$/, function(match, content) {

            });
            
            // 处理带有HTML锚点的块级公式 - 修复正则表达式
            content = content.replace(/<div id="([^"]+)"[^>]*>\s*\$\$([\s\S]*?)\$\$\s*<\/div>/g, function(match, id, formula) {
                log('找到带ID的公式:', id, formula.substring(0, 50) + '...');
                const placeholder = `[[[MATH_BLOCK_${blockIndex}]]]`;

            // 处理普通的块级公式
            content = content.replace(/\$\$([\s\S]*?)\$\$/g, function(match, formula) {

                const placeholder = `[[[MATH_BLOCK_${blockIndex}]]]`;

            // 处理行内公式 - 修复：允许换行符，支持多行公式
            content = content.replace(/(?<!\$)\$([^$]*?)\$(?!\$)/g, function(match, formula) {
                const placeholder = `[[[MATH_INLINE_${inlineIndex}]]]`;
                mathBlocks.push({
                    placeholder: placeholder,
                    formula: formula.trim(),
                    isBlock: false,

            // 新增：处理table代码块 - 使用之前保存的原始内容
            const tableBlocks = [];
            
            content = content.replace(/```table(?:\s+(.*?))?\s*\n([\s\S]*?)\n```/g, function(match, title, tableContent) {
                log('处理table代码块占位符...');
                tableIndex++;

                // 使用之前保存的原始表格内容
                const originalTable = originalTableContents[tableIndex - 1];

                });
                
                log(`创建table占位符: ${tableId}, 编号=${tableIndex}, 标题=${tableTitle}`);

                });

            log('数学公式处理完成，共找到', mathBlocks.length, '个公式');
            mathBlocks.forEach((block, index) => {
                if (block.id) {
                    log(`公式${index}: ID=${block.id}`);
                }
            });
            
            return { content, mathBlocks, tableBlocks, figureBlocks, theoremBlocks, assumptionBlocks, definitionBlocks, corollaryBlocks, propositionBlocks, lemmaBlocks, remarkBlocks, tableIndex, figureIndex, theoremIndex, assumptionIndex, definitionIndex, corollaryIndex, propositionIndex, lemmaIndex, remarkIndex };
        }

        // 工具函数：转义正则特殊字符
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function renderMathFormulas(htmlContent, mathBlocks) {
            log('开始渲染数学公式，共', mathBlocks.length, '个');
            
            mathBlocks.forEach(function(mathBlock, index) {
                try {
                    log(`渲染公式${index}:`, mathBlock.id ? `ID=${mathBlock.id}` : '无ID');
                    
                    const rendered = katex.renderToString(mathBlock.formula, { 
                        throwOnError: false,
                        displayMode: mathBlock.isBlock,
                        fleqn: false,
                        leqno: false
                    });
                    
                    let mathHtml;
                    if (mathBlock.isBlock) {
                        if (mathBlock.id) {
                            // 保留锚点的块级公式
                            mathHtml = `<div id="${mathBlock.id}" class="math-container katex-display" style="display: block; text-align: center; margin: 12px 0; width: 100%;">${rendered}<span class="math-source">${mathBlock.original}</span></div>`;
                            log(`创建带ID的公式: ${mathBlock.id}`);
                        } else {
                            // 普通块级公式
                            mathHtml = `<div class="math-container katex-display" style="display: block; text-align: center; margin: 12px 0; width: 100%;">${rendered}<span class="math-source">${mathBlock.original}</span></div>`;
                        }
                    } else {
                        // 行内公式
                        mathHtml = `<span class="math-container">${rendered}<span class="math-source">${mathBlock.original}</span></span>&#8203;`;
                    }
                    
                    // 用全字匹配替换占位符
                    htmlContent = htmlContent.replace(new RegExp(escapeRegExp(mathBlock.placeholder), 'g'), mathHtml);
                    log(`公式${index}渲染完成: ${mathBlock.placeholder} -> ${mathHtml.substring(0, 50)}...`);
                } catch (e) {
                    console.error('渲染公式失败:', e);
                    htmlContent = htmlContent.replace(new RegExp(escapeRegExp(mathBlock.placeholder), 'g'), mathBlock.original);
                }
            });
            
            log('数学公式渲染完成');
            return htmlContent;
        }

        // 专门处理表格内公式的函数
        function processTableMathFormulas(content) {
            const mathBlocks = [];

            log('开始处理表格内数学公式...');
            
            // 处理行内公式 - 修复：允许换行符，支持多行公式
            content = content.replace(/(?<!\$)\$([^$]*?)\$(?!\$)/g, function(match, formula) {

        function renderTableMathFormulas(htmlContent, mathBlocks) {

        // 后处理表格中的数学公式（直接在HTML中查找并替换）
        function postProcessTableMath(htmlContent) {
            log('开始后处理表格数学公式...');
            
            // 辅助函数：解码HTML实体并修复换行符
            function decodeAndFixFormula(text) {
                // 创建临时div来解码HTML实体
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = text;
                let decoded = tempDiv.textContent || tempDiv.innerText;
                
                // 修复换行符问题：确保 \\ 被正确处理
                if (decoded.includes('\\')) {
                    // 确保连续的反斜杠被正确处理
                    decoded = decoded.replace(/\\\s*\\\s*/g, '\\\\');
                }
                
                return decoded;
            }
            
            // 处理行内公式 $...$，注意这里要匹配可能包含换行的内容
            htmlContent = htmlContent.replace(/\$([^$]*?)\$/g, function(match, formula) {
                try {
                    log('处理行内公式:', formula);
                    // 解码HTML实体并修复换行符
                    const decodedFormula = decodeAndFixFormula(formula.trim());
                    
                    // 如果公式包含cases等多行结构，使用displayMode
                    const hasCases = decodedFormula.includes('\\begin{cases}');
                    const hasLineBreaks = decodedFormula.includes('\\\\');
                    const hasBeginEnv = decodedFormula.includes('\\begin{');
                    const isMultiline = hasCases || hasLineBreaks || hasBeginEnv;
                    
                    const rendered = katex.renderToString(decodedFormula, { 
                        throwOnError: false,
                        displayMode: isMultiline,
                        fleqn: false
                    });
                    
                    if (isMultiline) {
                        return `<div class="math-container katex-display" style="display: inline-block; text-align: center; margin: 2px 4px;">${rendered}</div>`;
                    } else {
                        return `<span class="math-container">${rendered}</span>`;
                    }
                } catch (e) {
                    console.error('渲染行内公式失败:', e);
                    return match;
                }
            });
            
            // 处理块级公式 $$...$$
            htmlContent = htmlContent.replace(/\$\$([\s\S]*?)\$\$/g, function(match, formula) {
                try {
                    log('处理块级公式:', formula.substring(0, 50) + '...');
                    // 解码HTML实体并修复换行符
                    const decodedFormula = decodeAndFixFormula(formula.trim());
                    
                    const rendered = katex.renderToString(decodedFormula, { 
                        throwOnError: false,
                        displayMode: true
                    });
                    return `<div class="math-container katex-display" style="display: block; text-align: center; margin: 6px 0;">${rendered}</div>`;
                } catch (e) {
                    console.error('渲染块级公式失败:', e);
                    return match;
                }
            });
            
            log('表格数学公式后处理完成');
            return htmlContent;
        }

        // Table rendering function - 在数学公式渲染完成后处理表格
        function renderTables(htmlContent, tableBlocks) {

                    // 直接渲染markdown，然后后处理数学公式
                    let renderedTable = marked.parse(originalTableContent);
                    log('Markdown渲染后，开始处理数学公式...');
                    
                    // 辅助函数：解码HTML实体
                    function decodeHtmlEntities(text) {
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = text;
                        return tempDiv.textContent || tempDiv.innerText || '';
                    }
                    
                    // 处理行内公式，支持多行内容
                    renderedTable = renderedTable.replace(/\$([^$]*?)\$/g, function(match, formula) {

                            let decodedFormula = decodeHtmlEntities(formula.trim());

                            // 特别处理：修复可能被破坏的换行符
                            // 在表格中，\\ 可能变成 \\\\，或者被转义成其他形式
                            if (decodedFormula.includes('\\begin{cases}')) {
                                // 确保换行符正确
                                decodedFormula = decodedFormula.replace(/\\\s+/g, '\\\\'); // 修复空格问题
                                decodedFormula = decodedFormula.replace(/\\\\\\\\/g, '\\\\'); // 修复双重转义
                                log('cases公式修复后:', JSON.stringify(decodedFormula));
                            }
                            
                            // 检查是否是多行公式
                            const hasCases = decodedFormula.includes('\\begin{cases}');
                            const hasLineBreaks = decodedFormula.includes('\\\\');
                            const isMultiline = hasCases || hasLineBreaks;
                            
                            log('多行检测:', { hasCases, hasLineBreaks, isMultiline });
                            
                            const rendered = katex.renderToString(decodedFormula, { 
                                throwOnError: false,
                                displayMode: isMultiline
                            });
                            
                            if (isMultiline) {
                                return `<div class="math-container katex-display" style="display: inline-block; text-align: center; margin: 2px 4px;">${rendered}</div>`;
                            } else {
                                return `<span class="math-container">${rendered}</span>`;

                    // 直接解析markdown图片语法：![alt](url) 或 ![alt](url){width=xx%}
                    const imgMarkdownMatch = originalFigureContent.match(/!\[([^\]]*)\]\(([^)]+)\)(\{[^}]*\})?/);
                    
                    if (imgMarkdownMatch) {
                        let imgAlt = imgMarkdownMatch[1] || '';
                        const imgSrc = imgMarkdownMatch[2] || '';
                        const imgOptions = imgMarkdownMatch[3] || '';
                        
                        log(`匹配到图片: src="${imgSrc.substring(0, 100)}..."`);

                        log(`options: "${imgOptions}"`);
                        
                        // 检测alt文本中的{width=xx%}语法 - 从alt中提取并移除
                        let widthMatch = imgAlt.match(/\{.*?width\s*=\s*([0-9]{1,3})%.*?\}/i);
                        let customWidth = null;
                        if (widthMatch) {
                            customWidth = widthMatch[1] + '%';
                            log(`发现width设置在alt中: ${customWidth}, 原alt长度: ${imgAlt.length}`);
                            log(`原alt内容: "${imgAlt}"`);
                            // 从alt文本中移除width语法 - 使用更精确的匹配
                            imgAlt = imgAlt.replace(/\{[^}]*?width\s*=\s*[0-9]{1,3}%[^}]*?\}/i, '').trim();
                            log(`移除width后alt长度: ${imgAlt.length}, 内容: "${imgAlt}"`);
                        } else {
                            log(`alt文本中没有发现width设置`);
                        }
                        
                        // 如果options中也有width，优先使用options中的
                        if (imgOptions) {
                            let optionsWidthMatch = imgOptions.match(/\{\s*width\s*=\s*([0-9]{1,3})%\s*\}/i);
                            if (optionsWidthMatch) {
                                customWidth = optionsWidthMatch[1] + '%';
                            }
                        }
                        
                        // 处理alt中的公式 - 先还原__DOLLAR__为$，然后渲染
                        let processedAlt = imgAlt;
                        log(`原始alt文本: ${processedAlt}`);
                        
                        // 先还原__DOLLAR__为$
                        processedAlt = processedAlt.replace(/__DOLLAR__/g, '$');
                        log(`还原$符号后的alt文本: ${processedAlt}`);
                        
                        if (/\$[^$]+\$/.test(processedAlt)) {
                            log(`发现数学公式，开始渲染...`);

        // Code copy functionality
        function addCopyButtons() {
            const codeBlocks = document.querySelectorAll('pre code');
            codeBlocks.forEach(function(codeBlock) {
                const pre = codeBlock.parentElement;
                
                // Avoid duplicate additions
                if (pre.querySelector('.copy-code-btn')) return;

                // Create wrapper
                const wrapper = document.createElement('div');
                wrapper.className = 'code-block-wrapper';
                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(pre);

                // Create copy button
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-code-btn';
                copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
                copyBtn.setAttribute('title', 'Copy Code');
                
                copyBtn.addEventListener('click', function() {
                    const code = codeBlock.textContent;
                    navigator.clipboard.writeText(code).then(function() {
                        copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied';
                        copyBtn.classList.add('copied');
                        
                        setTimeout(function() {
                            copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
                            copyBtn.classList.remove('copied');
                        }, 2000);
                    }).catch(function() {
                        // Fallback copy method for older browsers
                        const textArea = document.createElement('textarea');
                        textArea.value = code;
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                        
                        copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied';
                        copyBtn.classList.add('copied');
                        
                        setTimeout(function() {
                            copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
                            copyBtn.classList.remove('copied');
                        }, 2000);
                    });
                });

                wrapper.appendChild(copyBtn);
            });
        }

        // Math formula copy function
        function addMathCopyFunction() {
            const mathContainers = document.querySelectorAll('.math-container');
            mathContainers.forEach(function(container) {
                const mathSource = container.querySelector('.math-source');
                if (mathSource) {
                    container.addEventListener('click', function(e) {
                        e.preventDefault();
                        const sourceText = mathSource.textContent;
                        
                        navigator.clipboard.writeText(sourceText).then(function() {
                            // Show copy success notification
                            showToast('Formula copied: ' + sourceText);
                        }).catch(function() {
                            // Compatibility with older browsers
                            const textArea = document.createElement('textarea');
                            textArea.value = sourceText;
                            document.body.appendChild(textArea);
                            textArea.select();
                            document.execCommand('copy');
                            document.body.removeChild(textArea);
                            showToast('Formula copied: ' + sourceText);
                        });
                    });
                    
                    // Add click hint
                    container.style.cursor = 'pointer';
                    container.setAttribute('title', 'Click to copy formula source code');
                }
            });
        }

        // Formula tooltip functionality
        function addFormulaTooltip() {
            // Create tooltip element if it doesn't exist
            let tooltip = document.getElementById('formula-tooltip');
            if (!tooltip) {
                tooltip = document.createElement('div');
                tooltip.id = 'formula-tooltip';
                tooltip.className = 'formula-tooltip';
                document.body.appendChild(tooltip);
            }

            // Create table tooltip element if it doesn't exist
            let tableTooltip = document.getElementById('table-tooltip');
            if (!tableTooltip) {
                tableTooltip = document.createElement('div');
                tableTooltip.id = 'table-tooltip';
                tableTooltip.className = 'table-tooltip';
                document.body.appendChild(tableTooltip);
            }

            // Create academic content tooltip element if it doesn't exist
            let academicTooltip = document.getElementById('academic-tooltip');
            if (!academicTooltip) {
                academicTooltip = document.createElement('div');
                academicTooltip.id = 'academic-tooltip';
                academicTooltip.className = 'academic-tooltip';
                document.body.appendChild(academicTooltip);
            }

            // Find all formula links (links that point to formula IDs)
            const formulaLinks = document.querySelectorAll('a[href^="#eq"]');
            
            formulaLinks.forEach(function(link) {
                const href = link.getAttribute('href');
                const formulaId = href.substring(1); // Remove the # symbol
                
                // Find the corresponding formula element
                const formulaElement = document.getElementById(formulaId);
                
                if (formulaElement && formulaElement.classList.contains('math-container')) {
                    // Add hover events
                    link.addEventListener('mouseenter', function(e) {
                        showFormulaTooltip(e, formulaElement);
                    });
                    
                    link.addEventListener('mouseleave', function(e) {
                        hideFormulaTooltip();
                    });
                    
                    // Add visual indication that this link has tooltip
                    link.style.cursor = 'help';
                    link.setAttribute('title', '悬浮查看公式');
                }

        // Academic content tooltip functions
        function showAcademicTooltip(event, element, type) {
            const tooltip = document.getElementById('academic-tooltip');
            if (!tooltip) return;

            // Get the title and content
            const title = element.getAttribute('data-' + type + '-title') || type.charAt(0).toUpperCase() + type.slice(1);
            const content = element.querySelector('.' + type + '-content');
            if (!content) return;

            // Clone the content for the tooltip
            const clonedContent = content.cloneNode(true);
            
            // Clear tooltip and add the title and content
            tooltip.innerHTML = '';
            tooltip.className = 'academic-tooltip ' + type + '-tooltip';
            
            const titleElement = document.createElement('div');
            titleElement.className = 'tooltip-title';
            titleElement.textContent = title;
            tooltip.appendChild(titleElement);
            
            const contentElement = document.createElement('div');
            contentElement.className = 'tooltip-content';
            contentElement.appendChild(clonedContent);
            tooltip.appendChild(contentElement);

            // Use requestAnimationFrame to ensure DOM is updated before measuring
            requestAnimationFrame(() => {
                // Position the tooltip
                const rect = event.target.getBoundingClientRect();
                const tooltipRect = tooltip.getBoundingClientRect();
                
                // Calculate position - prefer showing above the link
                let left = rect.left + (rect.width / 2) - (tooltipRect.width / 2);
                let top = rect.top - tooltipRect.height - 10;

                // Adjust horizontal position if tooltip goes off screen
                if (left < 10) left = 10;
                if (left + tooltipRect.width > window.innerWidth - 10) {
                    left = window.innerWidth - tooltipRect.width - 10;
                }

                // Adjust vertical position if tooltip goes off screen
                if (top < 10) {
                    // Show below the link if there's not enough space above
                    top = rect.bottom + 10;
                    
                    // If still off screen below, try to center vertically
                    if (top + tooltipRect.height > window.innerHeight - 10) {
                        top = Math.max(10, (window.innerHeight - tooltipRect.height) / 2);
                    }
                }

                tooltip.style.left = left + 'px';
                tooltip.style.top = top + 'px';
                
                // Show the tooltip
                tooltip.classList.add('show');
            });
        }

                tooltip.className = 'figure-tooltip';
                document.body.appendChild(tooltip);

            // Get the figure content
            const figureContent = figureElement.querySelector('figure');
            if (!figureContent) return;

            // Get the image directly
            const originalImg = figureContent.querySelector('img');
            if (!originalImg) return;
            
            // Create a new image element for the tooltip
            const img = document.createElement('img');
            img.src = originalImg.src;
            img.alt = originalImg.alt;
            
            // Clear tooltip and add only the image (no caption)
            tooltip.innerHTML = '';
            tooltip.appendChild(img);
            
            // Wait for image to load to get its natural dimensions
            img.onload = function() {
                const naturalWidth = img.naturalWidth;
                const naturalHeight = img.naturalHeight;
                const aspectRatio = naturalWidth / naturalHeight;
                
                // Calculate optimal size within viewport constraints (larger for preview)
                const maxWidth = Math.min(window.innerWidth * 0.85, 1000);
                const maxHeight = Math.min(window.innerHeight * 0.85, 800);
                
                let width, height;
                if (aspectRatio > maxWidth / maxHeight) {
                    // Image is wider, constrain by width
                    width = maxWidth;
                    height = maxWidth / aspectRatio;
                } else {
                    // Image is taller, constrain by height
                    height = maxHeight;
                    width = maxHeight * aspectRatio;
                }
                
                // Set tooltip size to exactly match image (no extra padding for black borders)
                tooltip.style.width = width + 'px';
                tooltip.style.height = height + 'px';
                
                // Make sure image fills the entire tooltip
                img.style.width = width + 'px';
                img.style.height = height + 'px';
                img.style.objectFit = 'cover'; // Fill the entire space
            };

        function generateTableOfContents() {
            const url = new URL(window.location.href);
            log('generateTableOfContents called, currentSection=', typeof currentSection !== 'undefined' ? currentSection : 'undefined', 'section param=', url.searchParams.get('section'));
            if ((typeof currentSection !== 'undefined' && currentSection === 'run') || url.searchParams.get('section') === 'run') {
                document.getElementById('toc-container').style.display = 'none';
                document.getElementById('toc-fab').style.display = 'none';
                return;
            }
            
            const content = document.querySelector('.markdown-content');
            const tocContent = document.getElementById('toc-content');
            const tocFab = document.getElementById('toc-fab');
            
            log('Generating TOC, content found:', !!content);
            
            if (!content) {
                log('No markdown content found, hiding TOC');
                tocContent.innerHTML = '<div class="toc-empty">No headings found on this page</div>';
                tocFab.classList.remove('show');
                return;
            }
            
            const headings = content.querySelectorAll('h1, h2, h3, h4, h5, h6');
            log('Found headings:', headings.length);
            
            if (headings.length === 0) {
                log('No headings found, hiding TOC');
                tocContent.innerHTML = '<div class="toc-empty">No headings found on this page</div>';
                tocFab.classList.remove('show');
                return;
            }
            
            // 检查是否应该启用section编号（只对blog页面启用）
            const shouldEnableSectionNumbering = currentSection === 'blogs' || currentBlogPost !== null;
            
            // Generate section numbers and unique IDs for headings
            let sectionCounters = { h1: 0, h2: 0, h3: 0, h4: 0, h5: 0, h6: 0 };
            
            headings.forEach((heading, index) => {
                const level = heading.tagName.toLowerCase();
                
                let sectionNumber = '';
                let sectionId = '';
                
                if (shouldEnableSectionNumbering) {
                    // Reset counters for lower levels when encountering a higher level
                    if (level === 'h1') {
                        // 重置所有子级别计数器，然后增加h1计数器
                        sectionCounters.h2 = sectionCounters.h3 = sectionCounters.h4 = sectionCounters.h5 = sectionCounters.h6 = 0;
                        sectionCounters.h1++;
                    } else if (level === 'h2') {
                        sectionCounters.h3 = sectionCounters.h4 = sectionCounters.h5 = sectionCounters.h6 = 0;
                        sectionCounters.h2++;
                    } else if (level === 'h3') {
                        sectionCounters.h4 = sectionCounters.h5 = sectionCounters.h6 = 0;
                        sectionCounters.h3++;
                    } else if (level === 'h4') {
                        sectionCounters.h5 = sectionCounters.h6 = 0;
                        sectionCounters.h4++;
                    } else if (level === 'h5') {
                        sectionCounters.h6 = 0;
                        sectionCounters.h5++;
                    } else if (level === 'h6') {
                        sectionCounters.h6++;
                    }
                    
                    // Generate section number
                    if (level === 'h1') {
                        sectionNumber = sectionCounters.h1.toString();
                    } else if (level === 'h2') {
                        sectionNumber = sectionCounters.h1 + '.' + sectionCounters.h2;
                    } else if (level === 'h3') {
                        sectionNumber = sectionCounters.h1 + '.' + sectionCounters.h2 + '.' + sectionCounters.h3;
                    } else if (level === 'h4') {
                        sectionNumber = sectionCounters.h1 + '.' + sectionCounters.h2 + '.' + sectionCounters.h3 + '.' + sectionCounters.h4;
                    } else if (level === 'h5') {
                        sectionNumber = sectionCounters.h1 + '.' + sectionCounters.h2 + '.' + sectionCounters.h3 + '.' + sectionCounters.h4 + '.' + sectionCounters.h5;
                    } else if (level === 'h6') {
                        sectionNumber = sectionCounters.h1 + '.' + sectionCounters.h2 + '.' + sectionCounters.h3 + '.' + sectionCounters.h4 + '.' + sectionCounters.h5 + '.' + sectionCounters.h6;
                    }
                    
                    // Generate section ID - 使用简单格式以匹配引用
                    sectionId = 'sec' + sectionNumber.replace(/\./g, '-');
                } else {
                    // 对于非blog页面，生成简单的ID（基于原始内容或索引）
                    const text = heading.textContent.trim().toLowerCase();
                    sectionId = heading.id || text.replace(/[^a-z0-9\u4e00-\u9fff]/g, '') || `heading-${index}`;
                }
                
                // 设置标题ID
                const oldId = heading.id;
                heading.id = sectionId;
                log('Generated ID for heading:', heading.textContent.trim(), 'old ID:', oldId, '-> new ID:', sectionId, 'numbering enabled:', shouldEnableSectionNumbering);
                
                // 只对blog页面添加section编号
                if (shouldEnableSectionNumbering) {
                    // Add section number to heading if it doesn't already have one
                    const originalText = heading.textContent.trim();
                    if (!originalText.match(/^\d+(\.\d+)*\.?\s/)) {
                        heading.innerHTML = `<span class="section-number">${sectionNumber}</span> ${heading.innerHTML}`;
                        heading.setAttribute('data-section-number', sectionNumber);
                        heading.setAttribute('data-section-id', sectionId);
                    }
                }
            });
            
            // Generate TOC HTML
            let tocHtml = '';

                    log('Target element found:', !!targetElement);
                    
                    if (targetElement) {
                        log('Scrolling to element:', targetElement);
                        
                        // Use scrollIntoView - the most reliable method
                        targetElement.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start',
                            inline: 'nearest'
                        });

                        updateActiveTocItem(targetId);

        function updateActiveTocItem(headingId) {
            const tocItems = document.querySelectorAll('.toc-item');
            tocItems.forEach(item => {
                item.classList.remove('active');
                if (item.getAttribute('data-target') === headingId) {
                    item.classList.add('active');
                }
            });
            activeHeadingId = headingId;
        }

        function initScrollSpy() {
            const mainContent = document.querySelector('.main-content');
            const headings = document.querySelectorAll('.markdown-content h1, .markdown-content h2, .markdown-content h3, .markdown-content h4, .markdown-content h5, .markdown-content h6');
            
            if (headings.length === 0) return;
            
            const scrollHandler = () => {
                const scrollTop = mainContent.scrollTop;
                const offset = 100; // Offset for fixed elements
                
                let activeHeading = null;
                
                // Find the current heading in view
                for (let i = headings.length - 1; i >= 0; i--) {
                    const heading = headings[i];
                    const headingRect = heading.getBoundingClientRect();
                    const mainContentRect = mainContent.getBoundingClientRect();
                    
                    // Calculate relative position
                    const relativeTop = headingRect.top - mainContentRect.top + scrollTop;
                    
                    if (scrollTop + offset >= relativeTop) {
                        activeHeading = heading;
                        break;
                    }
                }
                
                // Update active TOC item if changed
                if (activeHeading && activeHeading.id !== activeHeadingId) {
                    updateActiveTocItem(activeHeading.id);
                }
            };
            
            // Remove existing scroll listener if any
            mainContent.removeEventListener('scroll', scrollHandler);
            // Add new scroll listener (throttled)
            mainContent.addEventListener('scroll', throttle(scrollHandler, 100));
            
            // Initial call
            scrollHandler();
        }

        async function loadBlogsContent() {
            const contentDiv = document.getElementById('content');

                log('Loading blogs content from JSON...');
                
                // Load blog file list from JSON (with cache-busting and retry)
                let response;
                for (let attempt = 1; attempt <= 3; attempt++) {
                    try {
                        const ts = new Date().getTime();
                        response = await fetch(`./blog-index.json?t=${ts}`, {
                            headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
                        });
                        if (response.ok) break;
                        if (attempt === 3) throw new Error(`Failed to load blog-index.json: ${response.status} ${response.statusText}`);
                        await new Promise(r => setTimeout(r, 1000 * attempt));
                    } catch (fetchErr) {
                        if (attempt === 3) throw fetchErr;
                        console.warn(`blog-index.json fetch attempt ${attempt} failed, retrying...`, fetchErr);
                        await new Promise(r => setTimeout(r, 1000 * attempt));
                    }
                }
                
                const blogsData = await response.json();
                const blogFiles = blogsData.blogs;
                
                log(`Found ${blogFiles.length} blog files in JSON:`, blogFiles);
                
                // Load and parse each blog file
                blogPosts = [];
                for (const fileName of blogFiles) {

                        const isEncrypted = fileName.endsWith('.md.enc');

        // Parse blog post, extract front matter and content
        function parseBlogPost(markdownText, fileName) {
            const frontMatterRegex = /^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/;
            const match = markdownText.match(frontMatterRegex);
            
            if (match) {
                try {
                    // Parse YAML front matter
                    const frontMatter = jsyaml.load(match[1]);
                    const content = match[2];
                    
                return {
                        ...frontMatter,
                        content: content,
                        fileName: fileName,
                        excerpt: generateExcerpt(content)
                };
            } catch (error) {
                    warn(`Failed to parse front matter for ${fileName}:`, error);
                }
            }
            
            // If no front matter, try to extract information from content
            const lines = markdownText.split('\n');
            const title = lines.find(line => line.startsWith('# '))?.replace('# ', '') || 'Untitled';
            
            return {
                title: title,
                date: new Date().toISOString().split('T')[0],
                tags: [],
                content: markdownText,
                fileName: fileName,
                excerpt: generateExcerpt(markdownText)
            };
        }

        // Generate article excerpt
        function generateExcerpt(content, maxLength = 200) {
            // Remove markdown syntax
            const plainText = content
                .replace(/#{1,6}\s+/g, '') // Remove heading symbols
                .replace(/\*\*(.*?)\*\*/g, '$1') // Remove bold
                .replace(/\*(.*?)\*/g, '$1') // Remove italic
                .replace(/\[(.*?)\]\(.*?\)/g, '$1') // Remove links, keep text
                .replace(/```[\s\S]*?```/g, '[Code Block]') // Replace code blocks
                .replace(/`(.*?)`/g, '$1') // Remove inline code symbols
                .trim();
            
            return plainText.length > maxLength 
                ? plainText.substring(0, maxLength) + '...'
                : plainText;
        }

        // === Encrypted blog utilities ===
        // Session-level cache: once unlocked, stay unlocked
        const _decryptedPosts = new Map();

        async function decryptBlogContent(encryptedBase64, password) {
            try {
                const encoder = new TextEncoder();
                const keyMaterial = await crypto.subtle.importKey(
                    'raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']
                );
                const key = await crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt: encoder.encode('lizhemin15-blog-enc'), iterations: 100000, hash: 'SHA-256' },
                    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
                );
                const raw = Uint8Array.from(atob(encryptedBase64), c => c.charCodeAt(0));
                const iv = raw.slice(0, 12);
                const ciphertext = raw.slice(12);
                const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
                return new TextDecoder().decode(decrypted);
            } catch (e) {
                return null;
            }
        }

        function showDecryptModal(blogTitle, onDecrypt) {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'decrypt-modal-overlay';
                overlay.innerHTML = `
                    <div class="decrypt-modal">
                        <div class="decrypt-modal-header">

                            <h3>加密文章</h3>

                        </div>
                        <div class="decrypt-modal-body">
                            <div class="decrypt-input-wrap">

                            </div>
                            <div class="decrypt-error" id="decrypt-error"><i class="fas fa-exclamation-circle"></i> 密码错误，请重试</div>
                            <div class="decrypt-actions">
                                <button class="btn-decrypt btn-cancel" id="decrypt-cancel">取消</button>
                                <button class="btn-decrypt btn-confirm" id="decrypt-confirm">解锁</button>
                            </div>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);

                const input = overlay.querySelector('#decrypt-password-input');
                const errorEl = overlay.querySelector('#decrypt-error');
                const confirmBtn = overlay.querySelector('#decrypt-confirm');
                const cancelBtn = overlay.querySelector('#decrypt-cancel');

                const close = (result) => { overlay.remove(); resolve(result); };

                confirmBtn.onclick = async () => {
                    const pwd = input.value;
                    if (!pwd) return;
                    const decrypted = await onDecrypt(pwd);
                    if (decrypted !== null) {
                        close(decrypted);
                    } else {
                        errorEl.classList.add('visible');
                        input.classList.add('shake');
                        setTimeout(() => input.classList.remove('shake'), 400);
                        input.value = '';
                        input.focus();
                    }
                };
                cancelBtn.onclick = () => close(null);
                overlay.onclick = (e) => { if (e.target === overlay) close(null); };
                input.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); confirmBtn.click(); } if (e.key === 'Escape') close(null); };
                input.focus();
            });
        }

        // Format date
        function formatDate(dateString) {
            if (!dateString) return 'Unknown Date';
            
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            } catch {
